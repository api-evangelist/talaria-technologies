name: Talaria Technologies
description: Talaria Technologies, Inc. was a developer-tools startup based in Palo
  Alto, California, founded in 2011, that built a dynamic web application server and
  runtime infrastructure for web developers — notably a just-in-time (JIT) compiler
  and runtime for PHP intended to help developers build and run websites more efficiently.
  It was surfaced as an Andreessen Horowitz (a16z) portfolio/investment-list company.
  Per public company-intelligence sources (indexed.vc, PrivCo, Bloomberg, CB Insights),
  Talaria was acquired by Google in 2013 and ceased operating as an independent company;
  it maintains no active website, developer portal, or public API surface today.
